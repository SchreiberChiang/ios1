name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🏗️ 使用 Xcode 构建 IPA
        run: |
          PROJECT_FILE="wechat1.xcodeproj"
          
          if [ ! -d "$PROJECT_FILE" ]; then
            echo "❌ 未找到 Xcode 项目: $PROJECT_FILE"
            exit 1
          fi

          echo "📁 找到项目: $PROJECT_FILE"

          # 自动获取 scheme 名称（取项目文件名去掉 .xcodeproj）
          SCHEME=$(basename "$PROJECT_FILE" .xcodeproj)
          echo "📋 使用 scheme: $SCHEME"

          # 执行构建（指定 -derivedDataPath 并搭配 -scheme）
          xcodebuild -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          # 查找生成的 .app 文件
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            # 如果未在 ./build 找到，尝试在默认 DerivedData 中查找
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -newer "$PROJECT_FILE" | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "✅ 找到 .app: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r -q app.ipa Payload
            echo "✅ IPA 打包完成"
          else
            echo "❌ 未找到 .app 文件"
            exit 1
          fi

      - name: 📤 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: app.ipa