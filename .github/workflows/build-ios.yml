name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🏗️ 使用 Xcode 构建 IPA
        run: |
          # 直接使用仓库中已有的 Xcode 项目
          PROJECT_FILE="wechat1.xcodeproj"
          
          if [ ! -d "$PROJECT_FILE" ]; then
            echo "❌ 未找到 Xcode 项目: $PROJECT_FILE"
            exit 1
          fi

          echo "📁 找到项目: $PROJECT_FILE"

          # 构建项目 (不使用代码签名)
          xcodebuild -project "$PROJECT_FILE" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          # 打包 IPA
          mkdir -p Payload
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r -q app.ipa Payload
            echo "✅ IPA 打包完成"
          else
            echo "❌ 未找到 .app 文件"
            exit 1
          fi

      - name: 📤 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: app.ipa