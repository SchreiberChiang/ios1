name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 安装 Godot 4.7.1 和导出模板
        run: |
          GODOT_VERSION="4.7.1"
          GODOT_RELEASE="stable"

          # 下载 Godot 编辑器 (macOS)
          echo "📥 下载 Godot ${GODOT_VERSION}..."
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_macos.universal.zip"
          unzip -q godot.zip
          sudo mv Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          # 下载 iOS 导出模板（使用你提供的链接）
          echo "📥 下载 iOS 导出模板..."
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          # 安装模板到 Godot 期望的路径
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "${TEMPLATES_DIR}"
          unzip -q export_templates.tpz -d "${TEMPLATES_DIR}"

          # 移动到版本子目录
          VERSION_FOLDER="${TEMPLATES_DIR}/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "${VERSION_FOLDER}"
          mv ${TEMPLATES_DIR}/templates/* "${VERSION_FOLDER}/" 2>/dev/null || true

          # 清理
          rm -f export_templates.tpz godot.zip

          echo "✅ Godot 安装完成: $(godot --version)"

      - name: 🎮 导出 Xcode 项目
        run: |
          # ⚠️ 将 "iOS" 替换为你在 Godot 中设置的导出预设名称
          godot --headless --export "iOS" ./ios_project

      - name: 🏗️ 使用 Xcode 构建 IPA
        run: |
          cd ios_project || exit 1

          PROJECT_FILE=$(ls *.xcodeproj 2>/dev/null | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ 未找到 .xcodeproj 文件"
            exit 1
          fi

          echo "📁 找到项目: $PROJECT_FILE"

          xcodebuild -project "$PROJECT_FILE" \
            -scheme "$PROJECT_FILE" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          # 打包 IPA
          mkdir -p Payload
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r -q app.ipa Payload
            echo "✅ IPA 打包完成"
          else
            echo "❌ 未找到 .app 文件"
            exit 1
          fi

      - name: 📤 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: ios_project/app.ipa