name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔍 检查库架构
        run: |
          echo "=== 检查 libgodot.a ==="
          file libgodot.a || true
          lipo -info libgodot.a || true
          echo "=== 检查 libMoltenVK.a ==="
          file libMoltenVK.a || true
          lipo -info libMoltenVK.a || true

      - name: 🏗️ 使用 Xcode 构建 IPA
        run: |
          PROJECT_FILE="wechat1.xcodeproj"
          SCHEME=$(basename "$PROJECT_FILE" .xcodeproj)

          # 强制指定架构为 arm64（真机），并设置部署目标
          xcodebuild -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          # 查找生成的 .app
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -newer "$PROJECT_FILE" | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "✅ 找到 .app: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r -q app.ipa Payload
            echo "✅ IPA 打包完成"
          else
            echo "❌ 未找到 .app 文件"
            exit 1
          fi

      - name: 📤 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: app.ipa